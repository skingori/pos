services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: kenya_hardware_pos
    volumes:
      - pos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos -d kenya_hardware_pos"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://pos:${POSTGRES_PASSWORD:-changeme}@db:5432/kenya_hardware_pos?schema=public
      DIRECT_URL: postgresql://pos:${POSTGRES_PASSWORD:-changeme}@db:5432/kenya_hardware_pos?schema=public
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  pos_pgdata:
